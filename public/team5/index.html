<!DOCTYPE html>
<!-- 넘어오는 순간 흰 화면이 스치지 않게 문서 바탕부터 금빛이다.
     CSS 가 적용되기 전에 브라우저가 칠하는 색이 이것이라, 여기서 흰색이면 아무리 빨라도
     한 번 번쩍인다 (사용자 지적 — 화면 전환이 느리다). -->
<html lang="ko" style="background:#000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>팀 소개 — 멋지조 원정대</title>
<style>
  :root{--ring-x:63.7%;--ring-y:15.41%;--staff-x:17.3%;--staff-y:53.16%}
  @font-face{font-family:"QuestSerif";src:url("assets/quest-serif.woff") format("woff");font-weight:700;font-display:swap}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{display:grid;place-items:center;cursor:none}
  .stage{position:relative;width:min(100vw,calc(100vh*1672/940));aspect-ratio:1672/940;overflow:hidden;background:#000;container-type:size}
  .bg{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ── 탑: 타오르는 불 ── */
  .tower-heat{
    position:absolute;left:56.8%;top:0;width:12.6%;height:40.56%;
    background-image:url("assets/bg.jpg");background-repeat:no-repeat;
    background-size:calc(100%/.126) calc(100%/.4056);background-position:65% 0%;
    filter:url(#heat);
    -webkit-mask:radial-gradient(ellipse 60% 70% at 50% 35%,#000 55%,transparent 100%);
            mask:radial-gradient(ellipse 60% 70% at 50% 35%,#000 55%,transparent 100%);
  }
  .glow{
    position:absolute;left:var(--ring-x);top:var(--ring-y);width:34%;aspect-ratio:1;
    translate:-50% -50%;border-radius:50%;mix-blend-mode:screen;
    background:radial-gradient(circle,rgba(255,225,140,.55) 0%,rgba(255,120,30,.38) 12%,rgba(255,80,10,.16) 28%,rgba(255,60,0,0) 60%);
    animation:breathe 2.6s ease-in-out infinite;
  }
  .glow.core{
    width:9%;filter:blur(4px);
    background:radial-gradient(circle,rgba(255,240,190,.45) 0%,rgba(255,150,40,.35) 30%,rgba(255,90,0,0) 70%);
    animation:flicker 1.1s steps(1,end) infinite,breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
  @keyframes flicker{0%{opacity:.95}12%{opacity:.7}25%{opacity:1}37%{opacity:.8}50%{opacity:.98}63%{opacity:.72}75%{opacity:.92}88%{opacity:.78}100%{opacity:1}}
  .flames{position:absolute;inset:0;pointer-events:none}
  .flame{
    position:absolute;left:var(--ring-x);top:var(--ring-y);translate:-50% -35%;
    border-radius:50% 50% 45% 45%/65% 65% 35% 35%;
    background:radial-gradient(ellipse at 50% 85%,#ffe08a 0%,#ff5a12 35%,rgba(255,60,0,.35) 70%,transparent 100%);
    filter:blur(2px);mix-blend-mode:screen;opacity:0;transform-origin:50% 100%;
    animation:lick var(--d,1.3s) ease-out var(--dl,0s) infinite;--rx:0%;
  }
  @keyframes lick{
    0%{opacity:0;transform:translate(var(--rx),0) scale(.55,.6) rotate(var(--r,0deg))}
    15%{opacity:.7}
    60%{opacity:.4;transform:translate(calc(var(--rx) + var(--sway,0%)),-60%) scale(.85,1.35) rotate(calc(var(--r,0deg) * -1))}
    100%{opacity:0;transform:translate(calc(var(--rx) + var(--sway,0%) * 1.6),-120%) scale(.35,1) rotate(0deg)}
  }
  canvas.embers{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;pointer-events:none}
  .castlight{
    position:absolute;inset:0;mix-blend-mode:screen;
    background:radial-gradient(ellipse 55% 70% at var(--ring-x) 16.83%,rgba(255,120,30,.22),rgba(255,80,0,0) 65%);
    animation:flicker 1.7s steps(1,end) infinite reverse;
  }
  /* CJ 로고 — 원색 */
  .logo-halo{
    position:absolute;left:var(--ring-x);top:var(--ring-y);width:6.2%;aspect-ratio:1;
    translate:-50% -50%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,250,225,.85) 0%,rgba(255,220,150,.55) 45%,rgba(255,160,60,0) 72%);
    animation:breathe 2.6s ease-in-out infinite;
  }
  .logo{
    position:absolute;left:var(--ring-x);top:var(--ring-y);width:4.9%;translate:-50% -50%;
    filter:drop-shadow(0 0 6px rgba(255,235,190,.9)) drop-shadow(0 0 14px rgba(255,150,40,.7));
    animation:logoBreathe 2.6s ease-in-out infinite;
  }
  @keyframes logoBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

  /* ── 마법사 지팡이 ── */
  .sglow{
    position:absolute;left:var(--staff-x);top:var(--staff-y);width:9%;aspect-ratio:1;
    translate:-50% -50%;border-radius:50%;mix-blend-mode:screen;filter:blur(3px);
    background:radial-gradient(circle,rgba(235,245,255,.75) 0%,rgba(170,205,255,.45) 18%,rgba(120,170,255,.18) 40%,rgba(90,140,255,0) 70%);
    animation:sPulse 2.2s ease-in-out infinite;
  }
  .score{
    position:absolute;left:var(--staff-x);top:var(--staff-y);width:2.2%;aspect-ratio:1;
    translate:-50% -50%;border-radius:50%;mix-blend-mode:screen;filter:blur(1.5px);
    background:radial-gradient(circle,#fff 0%,rgba(220,240,255,.9) 30%,rgba(160,200,255,0) 70%);
    animation:sFlick .9s steps(1,end) infinite,sPulse 2.2s ease-in-out infinite;
  }
  @keyframes sPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.18);opacity:1}}
  @keyframes sFlick{0%{opacity:1}20%{opacity:.75}40%{opacity:.95}60%{opacity:.7}80%{opacity:1}}
  .spark{
    position:absolute;left:var(--staff-x);top:var(--staff-y);width:var(--sz,1%);aspect-ratio:1;
    translate:-50% -50%;mix-blend-mode:screen;opacity:0;
    background:
      linear-gradient(#fff,#fff) center/12% 100% no-repeat,
      linear-gradient(#fff,#fff) center/100% 12% no-repeat,
      radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(200,225,255,.5) 25%,transparent 55%);
    -webkit-mask:radial-gradient(circle,#000 0%,#000 20%,transparent 62%);mask:radial-gradient(circle,#000 0%,#000 20%,transparent 62%);
    animation:twinkle var(--d,1.8s) ease-in-out var(--dl,0s) infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0;transform:translate(var(--ox),var(--oy)) scale(.2) rotate(0deg)}
    50%{opacity:.85;transform:translate(var(--ox),var(--oy)) scale(1) rotate(45deg)}
  }

  /* ── 말풍선 · 목표판 · 슬로건 ── */
  .say{
    position:absolute;translate:-50% -100%;
    font:700 1.42cqw/1.4 "QuestSerif","Noto Serif KR","Nanum Myeongjo",Batang,serif;
    color:#f4e3b6;text-align:center;white-space:pre-line;letter-spacing:.01em;
    text-shadow:0 1px 0 rgba(60,38,10,.9),0 0 3px rgba(0,0,0,.95),0 2px 6px rgba(0,0,0,.85),0 0 16px rgba(255,185,80,.5);
    opacity:0;animation:sayIn .01s linear forwards 0s,sayFloat 4.2s ease-in-out infinite var(--dl,0s);
  }
  .say::after{
    content:"";position:absolute;left:var(--tx,50%);top:100%;width:.9cqw;height:1.5cqw;margin-left:-.45cqw;
    border-left:.16cqw solid rgba(253,243,220,.85);border-bottom:.16cqw solid rgba(253,243,220,.85);
    border-radius:0 0 0 100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9));
    transform:scaleX(var(--tf,1));transform-origin:50% 0;
  }
  .say b{display:block;font-weight:800}
  @keyframes sayIn{from{opacity:0;transform:translateY(.8cqw)}to{opacity:1;transform:none}}
  @keyframes sayFloat{0%,100%{margin-top:0}50%{margin-top:-.35cqw}}

  .goal{
    position:absolute;left:2.4%;bottom:10.69%;width:13.6%;
    padding:1.35cqw .8cqw 1.25cqw;text-align:center;
    font-family:"QuestSerif","Noto Serif KR","Nanum Myeongjo",Batang,serif;
    background:linear-gradient(180deg,rgba(38,28,15,.96) 0%,rgba(16,11,6,.97) 55%,rgba(26,18,9,.96) 100%);
    border:.09cqw solid #8a6a2c;
    box-shadow:0 0 0 .22cqw rgba(10,7,4,.9),0 0 0 .32cqw rgba(178,138,62,.55),
      0 .5cqw 1.6cqw rgba(0,0,0,.7),inset 0 0 1.6cqw rgba(255,180,70,.13);
    opacity:0;animation:sayIn .01s linear 0s forwards;
  }
  .goal::before,.goal::after{
    content:"";position:absolute;left:.45cqw;right:.45cqw;height:.55cqw;
    background:
      radial-gradient(circle at 0 50%,#c9a458 0 .09cqw,transparent .1cqw),
      radial-gradient(circle at 100% 50%,#c9a458 0 .09cqw,transparent .1cqw),
      linear-gradient(90deg,transparent 8%,rgba(201,164,88,.75) 50%,transparent 92%) center/100% .07cqw no-repeat;
  }
  .goal::before{top:.45cqw}
  .goal::after{bottom:.45cqw}
  .goal .lbl{font-size:1.05cqw;font-weight:700;color:#b8912f;letter-spacing:.42em;text-indent:.42em;margin-bottom:.5cqw}
  .goal .val{
    font-size:2.05cqw;font-weight:700;line-height:1.15;
    background:linear-gradient(180deg,#fff3cf 0%,#e6c273 42%,#a97c25 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1px 0 rgba(50,32,8,.9)) drop-shadow(0 0 10px rgba(255,190,90,.4));
  }
  .slogan{
    position:absolute;left:44%;translate:-50% 0;bottom:10.44%;
    padding:.62cqw 2.6cqw;display:flex;align-items:center;gap:1cqw;
    background:linear-gradient(180deg,rgba(24,18,11,.95),rgba(9,7,4,.96));
    border-top:.1cqw solid rgba(198,158,80,.8);border-bottom:.1cqw solid rgba(198,158,80,.8);
    box-shadow:0 .5cqw 1.6cqw rgba(0,0,0,.7);
    font:700 1.58cqw/1 "QuestSerif","Noto Serif KR","Nanum Myeongjo",Batang,serif;
    color:#f2ddab;white-space:nowrap;letter-spacing:-.01em;text-shadow:0 0 12px rgba(255,190,90,.3);
    opacity:0;animation:sayIn .01s linear 0s forwards;
  }
  .slogan .dot{color:#c9a458;font-size:1.1cqw}

  .hint{position:fixed;left:50%;bottom:2.2vh;translate:-50% 0;
    font:500 12px/1.4 ui-sans-serif,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    letter-spacing:.06em;color:rgba(255,225,180,.75);background:rgba(0,0,0,.45);
    padding:.5em 1em;border-radius:999px;animation:hide 1s ease 7s forwards;pointer-events:none}
  @keyframes hide{to{opacity:0;visibility:hidden}}
</style>
</head>
<body>
<div id="td-in" aria-hidden
     style="position:fixed;inset:0;z-index:99999;pointer-events:none;background:#000;animation:td-in 320ms ease-out forwards"></div>
<style>@keyframes td-in{0%{opacity:1}100%{opacity:0}}</style>
<script>
/* 앞 화면이 어두워진 채 넘어온다. 같은 검정에서 짧게 밝아지기만 한다 — 연출을 더 얹으면
   상자에서 돼지가 나오는 장면을 잡아먹는다 (그 이유로 종이·먹물을 걷어냈다).
   다 밝아지면 지운다. 남겨 두면 이 페이지 위에 투명한 판이 계속 떠 있다. */
setTimeout(function(){ var el=document.getElementById('td-in'); if(el) el.remove(); }, 380);
</script>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="heat" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.045" numOctaves="2" seed="3" result="n">
      <animate attributeName="baseFrequency" dur="6s" values="0.018 0.045;0.024 0.06;0.018 0.045" repeatCount="indefinite"/>
    </feTurbulence>
    <feOffset in="n" dy="0" result="n2"><animate attributeName="dy" dur="1.2s" values="0;-40" repeatCount="indefinite"/></feOffset>
    <feDisplacementMap in="SourceGraphic" in2="n2" scale="6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="stage" id="stage">
  <img class="bg" src="assets/bg.jpg" alt="">
  <div class="castlight"></div>
  <div class="tower-heat"></div>
  <div class="glow"></div>
  <div class="glow core"></div>
  <div class="flames" id="flames"></div>
  <canvas class="embers" id="embers"></canvas>
  <div class="logo-halo"></div>
  <img class="logo" src="assets/cj-logo.png" alt="CJ">

  <div class="sglow"></div>
  <div class="score"></div>
  <div id="sparks"></div>

  <div class="say" style="left:12.8%;top:45.36%;--dl:0s;--tx:78%;--tf:-1">나는야 AI<b>똑똑박사!</b></div>
  <div class="say" style="left:45.5%;top:43.85%;--dl:0s;--tx:8%;--tf:-1">절뚝 절뚝</div>

  <div class="goal">
    <div class="lbl">목표</div>
    <div class="val">CJ 입사</div>
  </div>
  <div class="slogan"><span class="dot">◆</span>깁스와 목발이어도, 우리는 앞으로 간다.<span class="dot">◆</span></div>
</div>
<audio id="bgm" src="assets/bgm.mp3" preload="auto"></audio>
<div class="hint">Space 일시정지 · F 전체화면 · M 음악 재생/정지</div>

<script>
(() => {
  const stage = document.getElementById('stage');

  const flames = document.getElementById('flames'), N = 18;
  for (let i = 0; i < N; i++) {
    const f = document.createElement('div'); f.className = 'flame';
    const t = (i / N) * Math.PI * 2;
    f.style.setProperty('--rx', Math.cos(t) * 3.2 * 40 + '%');
    f.style.marginTop = (Math.sin(t) * 3.2).toFixed(2) + '%';
    f.style.setProperty('--d', (1 + Math.random() * .9).toFixed(2) + 's');
    f.style.setProperty('--dl', (-Math.random() * 2).toFixed(2) + 's');
    f.style.setProperty('--r', ((Math.random() - .5) * 18).toFixed(1) + 'deg');
    f.style.setProperty('--sway', ((Math.random() - .3) * 60).toFixed(0) + '%');
    f.style.width = (1.2 + Math.random() * 1.1).toFixed(2) + '%';
    f.style.height = (4 + Math.random() * 4.5).toFixed(2) + '%';
    flames.appendChild(f);
  }

  const sparks = document.getElementById('sparks');
  for (let i = 0; i < 14; i++) {
    const e = document.createElement('div'); e.className = 'spark';
    const a = Math.random() * Math.PI * 2, r = 30 + Math.random() * 130;
    e.style.setProperty('--ox', (Math.cos(a) * r).toFixed(0) + '%');
    e.style.setProperty('--oy', (Math.sin(a) * r * 1.1).toFixed(0) + '%');
    e.style.setProperty('--sz', (0.5 + Math.random() * 1).toFixed(2) + '%');
    e.style.setProperty('--d', (1.2 + Math.random() * 1.8).toFixed(2) + 's');
    e.style.setProperty('--dl', (-Math.random() * 3).toFixed(2) + 's');
    sparks.appendChild(e);
  }

  const cv = document.getElementById('embers'), ctx = cv.getContext('2d');
  let W, H, ps = [], last = performance.now();
  const resize = () => { W = cv.width = stage.clientWidth; H = cv.height = stage.clientHeight; };
  resize(); addEventListener('resize', resize);
  const RX = .637, RY = .1541;
  function spawn(){
    const a = Math.random() * Math.PI * 2, r = Math.random() * .036 * W;
    ps.push({ x: RX*W + Math.cos(a)*r, y: RY*H + Math.sin(a)*r*.75,
      vx: (Math.random()-.35)*.06*W/16, vy: -(.25+Math.random()*.6)*H/9,
      life: 1, decay: .25+Math.random()*.45, s: .6+Math.random()*1.4, w: Math.random()*6.283 });
  }
  function frame(now){
    const dt = Math.min(.05, (now - last)/1000); last = now;
    {
      for (let i = 0; i < 2; i++) spawn();
      ctx.clearRect(0,0,W,H); ps = ps.filter(p => p.life > 0);
      for (const p of ps){
        p.w += dt*6; p.x += (p.vx + Math.sin(p.w)*.02*W/16)*dt; p.y += p.vy*dt; p.vy *= .995; p.life -= p.decay*dt;
        const a = Math.max(0, p.life);
        ctx.beginPath(); ctx.fillStyle = `rgba(255,${Math.floor(90+110*a)},${Math.floor(30*a)},${a*.9})`;
        ctx.shadowColor = '#ff7a10'; ctx.shadowBlur = 3;
        ctx.arc(p.x, p.y, p.s*a*W/1672*1.4 + .3, 0, 6.283); ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const bgm = document.getElementById('bgm'); bgm.volume = .8;
  let started = false;
  const start = () => { if (!started){ started = true; bgm.play().catch(()=>{}); } };
  addEventListener('pointerdown', start, { once: true });
  /* 이스터에그(바탕화면 상자)에서 넘어오며 **바로** 켠다.
     ⚠️ start() 를 부르지 않는다. 그 함수는 막혀도 started 를 참으로 바꿔 버려서, 자동재생이
        거절되면 첫 클릭으로도 영영 안 켜진다. 성공했을 때만 표시한다. */
  /* 바탕화면 이스터에그가 상자를 누른 그 순간부터 이 곡을 틀고 있었다. 넘어오면서 재생
     위치를 `?t=` 로 달아 주므로, 그 지점부터 이어 틀면 두 화면에 걸쳐 한 곡으로 들린다.
     ⚠️ 같은 파일이라 이미 캐시에 있다 — 다시 받지 않는다.
     ⚠️ 값이 이상하면(직접 주소를 친 경우 등) 그냥 처음부터 튼다. */
  const at = parseFloat(new URLSearchParams(location.search).get('t') || '0');
  if (isFinite(at) && at > 0) { try { bgm.currentTime = at; } catch(e){} }
  bgm.play().then(() => { started = true; }).catch(() => {});
  /* ★ 여기서 **다음 장(SDLC·스프린트)으로 넘어간다** (사용자 요청 — 팀 소개 뒤에 붙여 달라).
       →/PageDown/Enter 만 받는다. 발표용 리모컨이 보내는 키가 정확히 이것들이라,
       무대에서 노트북을 안 만지고 넘길 수 있다.
     ⚠️ 클릭으로는 안 넘긴다. 이 화면의 클릭은 이미 **BGM 을 켜는 일**을 하고 있어서
        (자동재생이 막혔을 때의 유일한 탈출구다), 넘기기까지 얹으면 음악을 켜려던
        클릭 한 번에 화면이 넘어가 버린다.
     ⚠️ 재생 위치를 넘기지 않는다. 음악은 **이 화면까지만** 나온다 (사용자 요청) —
        넘어가는 순간 이 페이지가 버려지면서 소리도 같이 멎는다. */
  /* ★ Space 를 **"다음"** 에 넣었다 (사용자 결정 — 일시정지 기능 삭제).
       전에는 Space 가 불티를 멈추는 키였는데, 다음 화면(SDLC 덱)에서는 같은 키가
       "다음 장" 이다. 화면마다 뜻이 정반대였고, 발표용 리모컨이 보내는 키가 보통
       Space·PageDown 이라 리모컨을 누르면 넘어가는 대신 화면이 멈췄다.
       이제 어느 화면에서든 같은 키로 넘어간다. */
  const NEXT_KEYS = ['Enter', 'ArrowRight', 'PageDown', ' '];
  addEventListener('keydown', e => {
    if (NEXT_KEYS.includes(e.key)){
      e.preventDefault();
      location.href = 'sdlc.html';
      return;
    }
    if (e.key === 'm' || e.key === 'M'){ started = true; bgm.paused ? bgm.play() : bgm.pause(); return; }
    start();
    if (e.key === 'f' || e.key === 'F'){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  });
  let t; addEventListener('mousemove', () => { document.body.style.cursor='default'; clearTimeout(t); t=setTimeout(()=>document.body.style.cursor='none',1500); });
})();
</script>
</body>
</html>
