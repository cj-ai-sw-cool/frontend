# develop 에 들어온 것을 Vercel 프로덕션으로 올린다.
#
# Vercel 의 Git 연동을 쓰지 않는다. Hobby 플랜에서는 조직 소유 저장소를 연결할 수 없어서,
# 대신 CLI 가 소스를 직접 올리는 방식을 쓴다 — 이 경로에는 그 제한이 없다.
name: deploy-vercel

on:
  push:
    branches: [develop]
  workflow_dispatch:

# 배포가 겹치면 나중 것만 남긴다. 앞선 실행은 취소한다 — 먼저 끝난 옛 커밋이
# 나중 커밋을 덮어쓰는 순서 뒤집힘을 막는다.
concurrency:
  group: deploy-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Vercel Hobby 플랜은 커밋 작성자가 팀 소유자일 때만 배포를 받아준다.
      # 팀원이 올린 커밋은 BLOCKED 로 막히고, CLI 는 그 상태를 모르는 채 "Building…" 에서
      # 무한히 기다린다. 러너에 받아둔 사본에서만 작성자를 소유자로 맞춘다 — 저장소로 push 하지 않으므로
      # GitHub 쪽 커밋 이력은 그대로 남는다.
      - name: Normalize commit author
        env:
          DEPLOY_AUTHOR_NAME: ${{ vars.VERCEL_DEPLOY_AUTHOR_NAME }}
          DEPLOY_AUTHOR_EMAIL: ${{ vars.VERCEL_DEPLOY_AUTHOR_EMAIL }}
        run: |
          if [ -z "$DEPLOY_AUTHOR_NAME" ] || [ -z "$DEPLOY_AUTHOR_EMAIL" ]; then
            echo "저장소 변수 VERCEL_DEPLOY_AUTHOR_NAME / VERCEL_DEPLOY_AUTHOR_EMAIL 이 비어 있다." >&2
            exit 1
          fi
          git config user.name "$DEPLOY_AUTHOR_NAME"
          git config user.email "$DEPLOY_AUTHOR_EMAIL"
          git commit --amend --no-edit --reset-author
          git log -1 --format='배포 작성자: %an <%ae>'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 빌드 설정과 환경변수를 Vercel 에서 받아 온다. 이 저장소에 값을 복제해 두지 않는다 —
      # 두 곳에 같은 값이 있으면 한쪽만 바뀌어 어긋난다.
      - name: Pull project settings
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: woomacho-7856s-projects

      - name: Build
        run: vercel build --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: woomacho-7856s-projects

      # --prebuilt 를 빼면 위에서 만든 결과를 버리고 Vercel 이 다시 빌드한다.
      - name: Deploy
        timeout-minutes: 10
        run: |
          URL=$(vercel deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")
          echo "배포 완료: $URL"
          {
            echo "### Vercel 배포 완료"
            echo ""
            echo "- 커밋: \`${GITHUB_SHA:0:7}\`"
            echo "- 주소: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: woomacho-7856s-projects
