# 시연 서버(EC2)에서 프론트만 띄운다. 백엔드는 backend 레포의 compose 가 따로 올린다.
#
# 화면은 서버 안에서 백엔드를 부르므로 백엔드 포트를 밖으로 열 필요가 없다.
# 밖에 보이는 것은 3000 하나뿐이고, 그 3000 은 proxy.ts 의 비밀번호가 지킨다.
services:
  frontend:
    build: .
    restart: unless-stopped
    environment:
      # 백엔드는 같은 호스트의 docker 네트워크가 아니라 별도 compose 로 떠 있어
      # 호스트를 거쳐 부른다. host.docker.internal 은 리눅스에서 아래 extra_hosts 가 만든다.
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://host.docker.internal:8000}
      # 비어 있으면 아무도 못 막는다 — 시연 서버에서는 반드시 채운다
      DEMO_PASSWORD: ${DEMO_PASSWORD:?DEMO_PASSWORD 를 .env 에 넣으세요}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
